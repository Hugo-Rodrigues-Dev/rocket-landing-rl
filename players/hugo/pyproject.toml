[project]
name = "rocket_hugo"
version = "0.1.0"
description = "Environnement et agents de Hugo pour l'atterrissage de fusée"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium[mujoco]>=1.0",
    "mujoco>=3.2",
    "numpy>=2.0",
    "stable-baselines3>=2.4",
    "torch>=2.5",
    "wandb>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocket_hugo"]
