# Racine de l'espace de travail uv : elle ne contient pas de code.
# Chaque joueur a son paquet dans players/<prenom>/ ; un seul uv.lock pour tous.

[tool.uv.workspace]
members = ["players/*"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

# PyTorch : CPU sous Linux (la CI, évite de télécharger CUDA pour rien),
# CUDA sous Windows (PC avec carte NVIDIA), paquets PyPI normaux sous macOS.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Seul index CUDA qui publie torch 2.15 : pilote NVIDIA récent requis (CUDA 13.2).
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# Nos paquets : rangés après les bibliothèques externes dans les imports.
# Ajouter ici tout nouveau paquet de l'espace de travail.
[tool.ruff.lint.isort]
known-first-party = ["rocket_hugo", "rocket_quentin", "rocket_mathis"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
